name: Publish to npm

# Triggered by publishing a GitHub Release (not on every push to main) — a
# human explicitly creates the release, giving it a reviewable trigger with
# release notes, rather than every merge silently shipping a new version.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Fail loudly rather than publish the wrong version: the release tag
      # (e.g. v0.2.0) must match package.json's version exactly.
      - name: Verify release tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Verify the tarball resolves before it is published, not after. `exports`
      # in the repo points at ./src/*.ts (so the monorepo this is developed in
      # can consume TypeScript directly); `publishConfig.exports` rewrites those
      # to ./dist/*.js for the published package. Only pnpm applies
      # publishConfig — npm ignores it — so packing with npm ships an `exports`
      # map pointing at .ts files that aren't in the tarball, and every consumer
      # gets ERR_MODULE_NOT_FOUND. This guard fails the release instead.
      - name: Verify the packed tarball actually imports
        run: |
          set -e
          pnpm pack --pack-destination /tmp/pack
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install /tmp/pack/*.tgz >/dev/null
          node -e "
            const p = require('./node_modules/ts7-i18n/package.json');
            const main = p.exports['.'].default;
            if (main.includes('/src/')) {
              console.error('::error::published exports still point at ./src — publishConfig was not applied');
              process.exit(1);
            }
          "
          node --input-type=module -e "
            import { createTranslationRegistry } from 'ts7-i18n/registry';
            const LL = createTranslationRegistry({ en: { hi: 'Hi {name}' } }).getTranslations('en');
            if (LL.hi({ name: 'x' }) !== 'Hi x') { console.error('::error::smoke test produced wrong output'); process.exit(1); }
            console.log('tarball imports and renders correctly');
          "

      # `pnpm publish`, not `npm publish` — see the note above; npm would ship
      # the unrewritten exports map. Auth still comes from the .npmrc that
      # setup-node's `registry-url` writes, which pnpm reads too, so
      # NODE_AUTH_TOKEN is all that's needed. `--no-git-checks` because the
      # release tag means HEAD is detached, which pnpm otherwise refuses.
      - run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
